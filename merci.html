<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Merci — Alexis Bendavid</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:#05060a;color:#eef0f7;font-family:'Inter',system-ui,sans-serif;text-align:center;padding:24px;overflow:hidden;position:relative}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0}
.b1{width:46vw;height:46vw;background:#5b2bff;top:-12vw;left:-8vw}
.b2{width:42vw;height:42vw;background:#1fd6ff;bottom:-14vw;right:-8vw}
.box{position:relative;z-index:1;max-width:520px}
.check{width:78px;height:78px;border-radius:50%;background:linear-gradient(110deg,#8b5cff,#1fd6ff);display:grid;place-items:center;margin:0 auto 28px;font-size:2rem;color:#05060a;font-weight:700}
h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.05;letter-spacing:-.02em}
p{color:#9aa0b5;margin:18px 0 32px;font-size:1.05rem}
a{font-family:'Space Grotesk',sans-serif;font-weight:600;text-decoration:none;color:#05060a;background:linear-gradient(110deg,#8b5cff,#1fd6ff);padding:13px 26px;border-radius:100px;display:inline-block;transition:.3s}
a:hover{transform:translateY(-2px);box-shadow:0 12px 40px -10px rgba(120,90,255,.6)}
</style>
</head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="box">
  <div class="check">✓</div>
  <h1>Merci pour votre message.</h1>
  <p>Votre demande a bien été reçue. Réponse sous 24h pour planifier votre MVP gratuit.</p>
  <a href="index.html">← Retour à l'accueil</a>
</div>
</body></html>
